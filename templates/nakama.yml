x-stacker:
  description: nakama service
  shared_network: shared
  environment:
    POSTGRES_PASSWORD:
      description: PostgreSQL password; use the same value for services sharing PostgreSQL.
    POSTGRES_USER:
      description: PostgreSQL username; use the same value for services sharing PostgreSQL.
networks:
  shared:
    driver: bridge
services:
  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.22.0
    container_name: nakama
    networks:
    - shared
    volumes:
    - ./nakama/data:/nakama/data
    ports:
    - 7349:7349
    - 7350:7350
    - 7351:7351
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -ecx
    - /nakama/nakama migrate up --database.address ${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/nakama &&
      exec /nakama/nakama --name nakama1 --database.address ${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/nakama
      --logger.level DEBUG --session.token_expiry_sec 7200
    expose:
    - '7349'
    - '7350'
    - '7351'
    healthcheck:
      test:
      - CMD
      - /nakama/nakama
      - healthcheck
      interval: 10s
      timeout: 5s
      retries: 5
    links:
    - postgres:db
    depends_on:
    - postgres
