x-stacker:
  description: surrealdb service
  shared_network: shared
  environment:
    SURREAL_PASS:
      description: SurrealDB root password.
    SURREAL_USER:
      description: SurrealDB root username.
networks:
  shared:
    driver: bridge
services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: surrealdb
    networks:
    - shared
    volumes:
    - ./surrealdb:/mydata
    ports:
    - 8000:8000
    restart: unless-stopped
    command: start --user ${SURREAL_USER} --pass ${SURREAL_PASS} rocksdb:/mydata/surreal.db
    user: 1000:1000
