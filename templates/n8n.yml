x-stacker:
  description: n8n service
  shared_network: shared
  environment:
    GENERIC_TIMEZONE:
      description: Timezone for n8n, for example Asia/Jakarta.
    N8N_DOMAIN_NAME:
      description: Base domain for n8n, for example example.com.
    N8N_SUBDOMAIN:
      description: Subdomain for n8n, for example workflows.
    POSTGRES_PASSWORD:
      description: PostgreSQL password; use the same value for services sharing PostgreSQL.
    POSTGRES_USER:
      description: PostgreSQL username; use the same value for services sharing PostgreSQL.
networks:
  shared:
    driver: bridge
volumes:
  n8n_data:
    name: n8n_data
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    networks:
    - shared
    environment:
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_TYPE: postgresdb
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_HOST: ${N8N_SUBDOMAIN}.${N8N_DOMAIN_NAME}
      N8N_PORT: '5678'
      N8N_PROTOCOL: https
      NODE_ENV: production
      TZ: ${GENERIC_TIMEZONE}
      WEBHOOK_URL: https://${N8N_SUBDOMAIN}.${N8N_DOMAIN_NAME}/
    volumes:
    - n8n_data:/home/node/.n8n
    - ./local-files:/files
    ports:
    - 5678:5678
    restart: unless-stopped
    depends_on:
    - postgres
