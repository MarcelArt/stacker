x-stacker:
  description: jenkins service
  shared_network: shared
networks:
  shared:
    driver: bridge
volumes:
  jenkins_home:
    name: jenkins_home
services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    networks:
    - shared
    volumes:
    - jenkins_home:/var/jenkins_home
    - /var/run/docker.sock:/var/run/docker.sock
    ports:
    - 8080:8080
    - 50000:50000
    restart: unless-stopped
    user: root
