x-stacker:
  description: gitea service
  shared_network: shared
  environment:
    POSTGRES_PASSWORD:
      description: PostgreSQL password; use the same value for services sharing PostgreSQL.
    POSTGRES_USER:
      description: PostgreSQL username; use the same value for services sharing PostgreSQL.
networks:
  shared:
    driver: bridge
services:
  gitea:
    image: docker.gitea.com/gitea:1.26.2
    container_name: gitea
    networks:
    - shared
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__database__USER: ${POSTGRES_USER}
      USER_GID: '1000'
      USER_UID: '1000'
    volumes:
    - ./gitea:/data
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    ports:
    - 3000:3000
    - '222:22'
    restart: unless-stopped
    depends_on:
    - postgres
