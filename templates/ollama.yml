x-stacker:
  description: ollama service
  shared_network: shared
networks:
  shared:
    driver: bridge
volumes:
  ollama_data:
    name: ollama_data
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:
    - shared
    volumes:
    - ollama_data:/root/.ollama
    ports:
    - 11434:11434
    restart: unless-stopped
